<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Font Families Counter</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #ffffff;
        color: #111827;
        font-size: 12px;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }

      p {
        margin: 0 0 12px;
        color: #6b7280;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-weight: 500;
      }

      select {
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        font-size: 12px;
        margin-bottom: 8px;
      }

      button {
        border-radius: 6px;
        border: none;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .btn-primary {
        background: #111827;
        color: #ffffff;
      }

      .btn-secondary {
        background: #e5e7eb;
        color: #111827;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
        margin-bottom: 12px;
      }

      .result {
        padding: 8px;
        border-radius: 6px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        margin-bottom: 8px;
      }

      .result strong {
        font-weight: 600;
      }

      .table-container {
        max-height: 300px;
        overflow: auto;
        margin-top: 8px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 11px;
      }

      th,
      td {
        border-bottom: 1px solid #e5e7eb;
        padding: 6px 8px;
        text-align: left;
        vertical-align: middle;
      }

      th {
        background: #f3f4f6;
        font-weight: 600;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      tbody tr:hover {
        background: #f9fafb;
      }

      .color-swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid #d1d5db;
        margin-right: 6px;
        display: inline-block;
        vertical-align: middle;
      }

      .empty {
        color: #9ca3af;
        font-style: italic;
      }

      .error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>Font Scanner</h1>
    <p>Selecciona una página del archivo para ver todas las características tipográficas utilizadas.</p>

    <div>
      <label for="pageSelect">Página a escanear</label>
      <select id="pageSelect">
        <option value="" disabled selected>Cargando páginas…</option>
      </select>
    </div>

    <div class="toolbar">
      <button class="btn-primary" id="scanButton">Escanear página</button>
      <button class="btn-secondary" id="closeButton">Cerrar</button>
    </div>

    <div id="result" class="result">
      <div id="resultSummary" class="empty">
        Aún no se ha escaneado ninguna página.
      </div>
      <div id="tableContainer" class="table-container"></div>
    </div>

    <script>
      const pageSelect = document.getElementById('pageSelect');
      const scanButton = document.getElementById('scanButton');
      const closeButton = document.getElementById('closeButton');
      const resultSummary = document.getElementById('resultSummary');
      const tableContainer = document.getElementById('tableContainer');

      function populatePages(pages) {
        pageSelect.innerHTML = '';

        if (!pages || pages.length === 0) {
          const option = document.createElement('option');
          option.value = '';
          option.disabled = true;
          option.selected = true;
          option.textContent = 'No se han encontrado páginas';
          pageSelect.appendChild(option);
          return;
        }

        for (const page of pages) {
          const option = document.createElement('option');
          option.value = page.id;
          option.textContent = page.name;
          pageSelect.appendChild(option);
        }
      }

      function renderResult(data) {
        tableContainer.innerHTML = '';

        if (data.error) {
          resultSummary.textContent = data.error;
          resultSummary.className = 'error';
          return;
        }

        const styles = data.styles || [];

        if (!styles.length) {
          resultSummary.innerHTML =
            'La página <strong>' +
            (data.pageName || '') +
            '</strong> no contiene textos con estilos tipográficos detectables.';
          resultSummary.className = '';
          tableContainer.innerHTML = '<div class="empty">Sin estilos tipográficos</div>';
          return;
        }

        resultSummary.innerHTML =
          'La página <strong>' +
          (data.pageName || '') +
          '</strong> tiene <strong>' +
          styles.length +
          '</strong> estilo' +
          (styles.length === 1 ? '' : 's') +
          ' tipográfico' +
          (styles.length === 1 ? '' : 's') +
          ' único' +
          (styles.length === 1 ? '' : 's') +
          ' en ' +
          data.textCount +
          ' nodo' +
          (data.textCount === 1 ? '' : 's') +
          ' de texto.';
        resultSummary.className = '';

        let html = '<table><thead><tr>' +
          '<th>Familia</th>' +
          '<th>Estilo</th>' +
          '<th>Tamaño</th>' +
          '<th>Interlineado</th>' +
          '<th>Tracking</th>' +
          '<th>Color</th>' +
          '<th>Usos</th>' +
          '</tr></thead><tbody>';

        for (const s of styles) {
          const color = s.fill || 'n/a';
          const swatchStyle = color.startsWith('rgb')
            ? 'background:' + color + ';'
            : '';

          html += '<tr>' +
            '<td>' + (s.fontFamily || '-') + '</td>' +
            '<td>' + (s.fontStyle || '-') + '</td>' +
            '<td>' + (s.fontSize || '-') + '</td>' +
            '<td>' + (s.lineHeight || '-') + '</td>' +
            '<td>' + (s.letterSpacing || '-') + '</td>' +
            '<td><span class="color-swatch" style="' + swatchStyle + '"></span>' +
            color +
            '</td>' +
            '<td>' + (s.count || 0) + '</td>' +
            '</tr>';
        }

        html += '</tbody></table>';
        tableContainer.innerHTML = html;
      }

      // Mensajes desde el código del plugin
      window.onmessage = event => {
        const message = event.data.pluginMessage;
        if (!message || typeof message !== 'object') return;

        if (message.type === 'init') {
          populatePages(message.pages || []);
        }

        if (message.type === 'scan-result') {
          renderResult(message);
        }
      };

      // Escanear la página seleccionada
      scanButton.onclick = () => {
        const pageId = pageSelect.value;
        if (!pageId) {
          resultSummary.textContent = 'Por favor, selecciona una página primero.';
          resultSummary.className = 'error';
          tableContainer.innerHTML = '';
          return;
        }

        resultSummary.textContent = 'Escaneando página…';
        resultSummary.className = '';
        tableContainer.innerHTML = '';

        parent.postMessage(
          { pluginMessage: { type: 'scan-page', pageId } },
          '*'
        );
      };

      // Cerrar plugin
      closeButton.onclick = () => {
        parent.postMessage(
          { pluginMessage: { type: 'close' } },
          '*'
        );
      };
    </script>
  </body>
</html>
